# Release notes generated by GitHub (gh release create --generate-notes, ADR 0024): the merged
# pull requests since the previous release, grouped by their labels. A pull request goes into
# the first category that matches one of its labels; unlabelled ones go to "Other changes".
# Label an epic PR with its epic's labels (gh pr edit N --add-label type:epic,area:...) so it
# lands in the right group (docs/release-checklist.md).
changelog:
  categories:
    - title: Milestones (epics)
      labels: [type:epic]
    - title: Recompiler
      labels: [area:recomp]
    - title: Runtime and HLE
      labels: [area:runtime, area:objc, area:audio, area:render, area:input, area:ui, area:save]
    - title: Platforms
      labels: [area:platform-mac, area:platform-win, area:platform-linux, area:platform-ios]
    - title: Reverse engineering, formats and assets
      labels: [area:re, area:formats, area:assets]
    - title: Build, CI and releases
      labels: [area:infra, area:qa]
    - title: Enhancements
      labels: [area:enhancement]
    - title: Fixes
      labels: [type:bug]
    - title: Docs and decisions
      labels: [type:docs, type:adr, type:research]
    - title: Other changes
      labels: ["*"]
