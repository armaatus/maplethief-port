# CI (issue #3, ADR 0006, ADR 0126). The target branch decides what runs:
#
#   pull request into dev    the cheap profile: lint + Python min/latest, and a Linux Debug
#                            build with the C/C++ tests. Feature and epic branches merge here.
#   pull request into main   the full profile: the release pull request from dev (ADR 0126,
#                            titled "Release vX.Y.Z"). Debug and Release builds with the C/C++
#                            tests and the packaged kits on macOS, Windows and Linux, plus lint
#                            and Python. release.yml checks the title and, after the merge, tags
#                            and drafts the release.
#   manual run               the full profile (Release unless its `release` input is off).
#
# Pushes don't trigger it. The repository is public, so GitHub-hosted runners cost no minutes;
# the split keeps a feature pull request's wait short and puts macOS and Windows where a release
# needs them. MSVC's warnings are approximated on the Mac by clang's (CMakeLists.txt), so most
# Windows breaks show up before the release pull request.
#
# CI never sees the IPA. The repository doesn't contain it (each user supplies their own copy,
# ADR 0100), and a guard step fails the job if any *.ipa or Git LFS object ever shows up in the
# checkout. Every test uses synthetic fixtures; tests marked real_assets report as SKIPPED.
# A second guard (scripts/compendium guard, in the lint + Python job) fails on any tracked
# file that looks like compendium output (ADR 0121).
#
# The Release jobs build the macOS universal binary and the packaged kits. A manual run can
# also target self-hosted runners (`runners` input; README, "Self-hosted runners"); pull
# requests always run on GitHub-hosted runners, so code from a pull request never runs on our
# machines.
#
# A pull request (into either branch) that only touches documentation or compendium work
# (scripts/ci-scope has the list) skips the build matrix: the `scope` job decides, and the
# build jobs then show as skipped. The lint + Python job always runs. Manual runs always run
# everything.
#
# Third-party actions are pinned to full commit SHAs (the tag is in the comment). Bump one
# action per commit.

name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      release:
        description: "Add the Release jobs (release workflows: build, test, package)"
        type: boolean
        default: true
      runners:
        description: "GitHub-hosted runners, or the self-hosted ones (labels in README)"
        type: choice
        options: [hosted, self-hosted]
        default: hosted

permissions:
  contents: read

concurrency:
  # A newer push to the same PR (or a new manual run on the same branch) cancels the older run,
  # except on main.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The uv version the repo is tested with (ADR 0003, ADR 0005).
  UV_VERSION: "0.11.7"
  # Python comes from actions/setup-python, never from a uv download, so the log names
  # exactly the interpreter that ran the tests.
  UV_PYTHON_DOWNLOADS: never
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"

jobs:
  scope:
    name: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      native: ${{ steps.scope.outputs.native }}
    steps:
      - name: Check out (without Git LFS objects)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false
          sparse-checkout: scripts/ci-scope
          sparse-checkout-cone-mode: false

      - name: Decide whether the build matrix is needed (scripts/ci-scope)
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ]; then
            echo "native=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > changed.txt
          count=$(wc -l < changed.txt)
          echo "$count changed file(s)"
          # The files API lists at most 3,000 files; past that the list is cut, so build.
          if [ "$count" -ge 3000 ]; then
            echo "native=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/ci-scope < changed.txt | tee -a "$GITHUB_OUTPUT"
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}

  build:
    name: ${{ matrix.os }} ${{ matrix.config }}
    needs: scope
    if: needs.scope.outputs.native == 'true'
    # The hosted image, or on a manual self-hosted run the matching self-hosted labels.
    runs-on: ${{ fromJSON(inputs.runners == 'self-hosted' && (matrix.os == 'macos-latest' && '["self-hosted","macOS","ARM64"]' || matrix.os == 'windows-latest' && '["self-hosted","Windows","X64"]' || '["self-hosted","Linux","X64"]') || format('"{0}"', matrix.os)) }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Into dev: Linux only. Into main (the release pull request) and manual runs: all three.
        os: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref != 'main' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest","windows-latest"]') }}
        # Release builds and kits on the release pull request, and on manual runs unless the
        # `release` input is off (ADR 0126).
        config: ${{ fromJSON(((github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'workflow_dispatch' && inputs.release)) && '["debug","release"]' || '["debug"]') }}
    steps:
      - name: Check out (without Git LFS objects)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - &ipa-guard
        name: Guard - no IPA content in the workspace
        shell: bash
        run: |
          # Fails if the checkout holds any *.ipa (tracked or not) or a Git LFS object: the
          # repository never contains the game, each user supplies their own IPA (ADR 0100).
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            found=1
            echo "::error file=$f::$f is in the checkout. The repository must never contain an IPA."
          done < <(find . -name .git -prune -o -iname '*.ipa' -print0)
          if [ -n "$(git ls-files -- '*.ipa' '*.IPA')" ]; then
            found=1
            echo "::error::git tracks an *.ipa:"
            git ls-files -- '*.ipa' '*.IPA'
          fi
          if [ -d .git/lfs/objects ] && [ -n "$(find .git/lfs/objects -type f -print -quit)" ]; then
            found=1
            echo "::error::.git/lfs/objects is not empty: Git LFS objects were fetched"
          fi
          [ "$found" -eq 0 ] || exit 1
          echo "OK: no *.ipa in the checkout or the index, no Git LFS objects"

      - name: Set up Python
        id: python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Set up uv
        if: matrix.config == 'debug'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Cache third-party downloads (build/_downloads)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/_downloads
          key: downloads-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Install SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          # The README's list (written for Ubuntu 24.04; ubuntu-latest is 26.04 as of 2026-10).
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config python3 \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libx11-dev libxext-dev \
            libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev libdbus-1-dev libudev-dev

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: command -v ninja >/dev/null || brew install ninja

      - name: Set up the Visual Studio x64 developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Show toolchain versions
        shell: bash
        run: |
          cmake --version | head -n 1
          echo "ninja $(ninja --version)"
          "$PYTHON" --version
          if command -v uv >/dev/null 2>&1; then uv --version; fi
          case "$RUNNER_OS" in
            Windows) cl 2>&1 | head -n 1 ;;
            macOS) clang++ --version | head -n 1; sw_vers -productVersion ;;
            Linux) c++ --version | head -n 1 ;;
          esac
        env:
          PYTHON: ${{ steps.python.outputs.python-path }}

      - name: Build and run all tests (scripts/test)
        if: matrix.config == 'debug' && runner.os != 'Windows'
        run: scripts/test

      - name: Build and run all tests (scripts/test.ps1)
        if: matrix.config == 'debug' && runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1

      - name: Release build, C/C++ tests and package
        if: matrix.config == 'release'
        # pwsh on every OS: the default shell differs per OS (bash vs pwsh), and bash on
        # Windows would put Git's /usr/bin/link ahead of MSVC's link.exe.
        shell: pwsh
        run: cmake --workflow --preset $env:PRESET
        env:
          PRESET: ${{ runner.os == 'macOS' && 'mac-release-universal' || runner.os == 'Windows' && 'win-release' || 'linux-release' }}

      - name: Check the universal binary (macOS)
        if: matrix.config == 'release' && runner.os == 'macOS'
        run: |
          bin=build/mac-release-universal/platform/MapleThief.app/Contents/MacOS/MapleThief
          lipo -info "$bin"
          lipo "$bin" -verify_arch arm64 x86_64

      # Only test reports, and only when something failed: build/test-output/ (golden-image
      # diffs) and CTest's logs. Never upload build/ as a whole, binaries, or anything derived
      # from the IPA. CI has no IPA, so these files are synthetic, but the rule holds anyway.
      - name: Upload test logs (on failure)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.config }}
          path: |
            build/test-output/
            build/*/Testing/Temporary/LastTest*.log
          if-no-files-found: ignore
          retention-days: 7

  lint-python:
    name: lint + Python min/latest
    runs-on: ${{ fromJSON(inputs.runners == 'self-hosted' && '["self-hosted","Linux","X64"]' || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - name: Check out (without Git LFS objects)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: false
          persist-credentials: false

      - *ipa-guard

      - name: Set up the minimum Python (3.10, ADR 0002)
        id: python-min
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Set up the latest Python release
        id: python-latest
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
          check-latest: true

      # The compendium site and its images are built locally and never land in git
      # (ADR 0121, issue #226): fails on tracked files under build/, work/ or assets-out/, a
      # site marker, search index, image manifest or bundle, an exported page, or an image
      # outside tests/golden/data/ and docs/controls/.
      - name: Guard - no compendium output in the tracked files
        run: scripts/compendium guard
        env:
          PYTHON: ${{ steps.python-latest.outputs.python-path }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          # scripts/lint pins the linters that uvx installs into the same cache.
          cache-dependency-glob: |
            uv.lock
            scripts/lint

      - name: Lint (scripts/lint)
        run: scripts/lint

      - name: Python tests on Python ${{ steps.python-min.outputs.python-version }}
        run: scripts/test --python-only
        env:
          UV_PYTHON: ${{ steps.python-min.outputs.python-path }}

      - name: Python tests on Python ${{ steps.python-latest.outputs.python-version }}
        run: scripts/test --python-only
        env:
          UV_PYTHON: ${{ steps.python-latest.outputs.python-path }}
